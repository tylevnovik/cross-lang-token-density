[project]
name = "cross-lang-token-density"
version = "0.1.0"
description = "Cross-language source code token density analysis for coding-agent era project selection."
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2",
  "pyarrow>=16.0",
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
  "tiktoken>=0.7",
  "pygments>=2.18",
  "scipy>=1.13",
  "statsmodels>=0.14",
  "matplotlib>=3.9",
  "seaborn>=0.13",
  "plotly>=5.22"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cltd"]

[dependency-groups]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
  "mypy>=1.10"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
